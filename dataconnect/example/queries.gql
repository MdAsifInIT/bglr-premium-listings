# dataconnect/example/queries.gql

# Fetch all approved real estate listings for the public discovery feed
query ListApprovedProperties(
  $minLat: Float!,
  $maxLat: Float!,
  $minLng: Float!,
  $maxLng: Float!
) @auth(level: PUBLIC, insecureReason: "Public browsing allowed for property listings") {
  properties(where: {
    isApproved: { eq: true }
    latitude: { ge: $minLat, le: $maxLat }
    longitude: { ge: $minLng, le: $maxLng }
  }) {
    id
    title
    description
    price
    bhkCount
    propertyType
    listingType
    locality
    latitude
    longitude
    imageUrls
  }
}

# Fetch a single property details page by its unique database ID
query GetPropertyById($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public access for specific property details views") {
  property(key: { id: $id }) {
    id
    title
    description
    price
    bhkCount
    propertyType
    listingType
    locality
    latitude
    longitude
    imageUrls
    owner {
      fullName
      phoneNumber
    }
  }
}

# Fetch the signed-in profile for authorization-aware client UI
query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    fullName
    phoneNumber
    isAdmin
  }
}

# Fetch all unapproved property listings for the admin moderation queue
query ListPendingProperties @auth(level: USER) {
  currentUser: user(key: { id_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Admin profile not found") {
    isAdmin @check(expr: "this == true", message: "Admin privileges required")
  }
  properties(where: { isApproved: { eq: false } }) {
    id
    title
    price
    locality
    propertyType
    listingType
    imageUrls
    owner {
      fullName
    }
  }
}

# Fetch all properties owned by the currently authenticated user
query ListUserProperties @auth(level: USER) {
  properties(where: { ownerId: { eq_expr: "auth.uid" } }) {
    id
    title
    price
    locality
    propertyType
    listingType
    isApproved
    imageUrls
    createdAt
  }
}

# Fetch all favorites (shortlisted properties) for the current user
query ListUserFavorites @auth(level: USER) {
  favorites(where: { userId: { eq_expr: "auth.uid" } }) {
    property {
      id
      title
      price
      locality
      bhkCount
      imageUrls
      listingType
    }
  }
}

# Fetch all saved searches for the current user
query ListUserSavedSearches @auth(level: USER) {
  savedSearches(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    filters
    label
    createdAt
  }
}
